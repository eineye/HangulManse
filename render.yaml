# Render 블루프린트: Render 대시보드 → New → Blueprint → 이 저장소 선택.
# 학습 기록·콘텐츠를 저장할 영구 디스크가 필요해 무료(free) 플랜이 아닌 유료 플랜을 사용한다.
services:
  - type: web
    name: hangulmanse
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /api/health
    disk:
      name: hangulmanse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data/data
      - key: CONTENT_DIR
        value: /var/data/content
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
