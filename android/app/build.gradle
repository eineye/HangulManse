plugins {
    id 'com.android.application'
}

// 한글만세 Android 앱 = 배포된 웹사이트를 Chrome으로 전체 화면 실행하는 TWA(Trusted Web Activity).
// 웹(Next.js)을 고치면 앱을 다시 빌드하지 않아도 바로 반영된다.
def twaHost = project.property('twaHost').toString().replaceAll('^https?://', '').replaceAll('/.*$', '')
def twaLaunchPath = project.property('twaLaunchPath').toString()
def launchUrl = "https://${twaHost}${twaLaunchPath.startsWith('/') ? twaLaunchPath : '/' + twaLaunchPath}"
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()

// 앱이 열어도 되는 주소 범위 (예: GitHub Pages 체험판은 /HangulManse)
def twaPathPrefix = (project.findProperty('twaPathPrefix') ?: '/').toString()

// 서명: 환경 변수(ANDROID_KEYSTORE_FILE 등)가 있으면 그 키로(정식 배포용),
// 없으면 저장소에 포함된 공개 테스트 키(app/test-signing.jks)로 서명한다.
// 테스트 키는 누구나 볼 수 있으므로 시험용으로만 쓴다 — 대신 빌드마다 서명이 같아서
// 새 APK를 덮어 설치해도 앱 데이터(체험판 학습 기록)가 유지된다.
// (워크플로에서 시크릿이 없으면 빈 문자열로 전달되므로 null뿐 아니라 빈 값도 걸러야 한다)
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')?.trim()
def hasReleaseKey = keystoreFile && file(keystoreFile).exists()

android {
    namespace 'kr.hangulmanse.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.hangulmanse.app'
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        resValue 'string', 'appName', '한글만세'
        resValue 'string', 'launcherName', '한글만세'
        // 웹사이트의 /.well-known/assetlinks.json 과 짝을 이루는 선언
        resValue 'string', 'assetStatements',
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${twaHost}\\\"}}]"

        manifestPlaceholders = [
            hostName  : twaHost,
            launchUrl : launchUrl,
            pathPrefix: twaPathPrefix,
        ]
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
        publicTest {
            storeFile file('test-signing.jks')
            storePassword 'hangulmanse-test'
            keyAlias 'hangulmanse-test'
            keyPassword 'hangulmanse-test'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.publicTest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
