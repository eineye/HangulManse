name: Android APK

# Actions 탭 → "Android APK" → Run workflow 에서 배포된 웹 주소를 넣고 실행하면
# 스마트폰에 설치할 APK가 Artifacts로 만들어진다.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "배포된 웹사이트 도메인 (예: hangulmanse.onrender.com). 비우면 저장소 변수 TWA_HOST 사용"
        required: false
        default: ""
      version_name:
        description: "앱 버전 이름"
        required: false
        default: "1.0.0"
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 설정
        id: cfg
        env:
          INPUT_HOST: ${{ github.event.inputs.host }}
          VAR_HOST: ${{ vars.TWA_HOST }}
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          HOST="${INPUT_HOST:-$VAR_HOST}"
          HOST="${HOST#https://}"; HOST="${HOST#http://}"; HOST="${HOST%%/*}"
          if [ -z "$HOST" ]; then
            HOST="hangulmanse.example.com"
            echo "::warning::배포 주소가 없어 예시 주소로 빌드합니다(빌드 검증용). 실행 시 host를 입력하거나 저장소 변수 TWA_HOST를 설정하세요."
          fi
          VERSION="${INPUT_VERSION:-1.0.0}"
          # 입력값이 셸 명령에 들어가므로 형식을 엄격히 검사한다
          echo "$HOST" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$' || { echo "::error::도메인 형식이 올바르지 않습니다: $HOST"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9A-Za-z.+-]{1,32}$' || { echo "::error::버전 형식이 올바르지 않습니다: $VERSION"; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 서명 키 준비
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 임시 디버그 키로 서명합니다. 빌드마다 서명이 바뀌므로 테스트용으로만 쓰세요(docs/DEPLOY.md 참고)."
          fi

      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PtwaHost="${{ steps.cfg.outputs.host }}" \
            -PappVersionName="${{ steps.cfg.outputs.version }}" \
            -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hangulmanse-${{ steps.cfg.outputs.version }}.apk"

      - name: 서명 지문(SHA-256) 출력
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE"/hangulmanse-*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "## 한글만세 APK"
            echo "- 웹 주소: https://${{ steps.cfg.outputs.host }}"
            echo "- 버전: ${{ steps.cfg.outputs.version }} (${{ github.run_number }})"
            echo "- 서명 SHA-256: \`$FP\`"
            echo ""
            echo "주소창 없이 전체 화면으로 열리게 하려면 웹 서버 환경 변수 \`ANDROID_SHA256_FINGERPRINTS\`에 위 지문을 넣으세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hangulmanse-apk
          path: hangulmanse-*.apk
          if-no-files-found: error
