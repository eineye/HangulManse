name: Android APK

# 스마트폰에 설치할 한글만세 Android 앱(APK)을 만든다.
# - 기본(서버 주소 없음): GitHub Pages 체험판 https://<owner>.github.io/<repo>/ 를 여는 시험용 앱.
#   main에 푸시할 때마다 자동으로 빌드되어 "android-latest" 릴리스에 올라간다:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/hangulmanse.apk
# - 정식 서버 배포 후: Run workflow에서 host를 넣거나 저장소 변수 TWA_HOST를 설정하면 그 서버를 연다.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "서버 도메인 (예: hangulmanse.onrender.com). 비우면 TWA_HOST 변수, 그것도 없으면 GitHub Pages 체험판"
        required: false
        default: ""
      version_name:
        description: "앱 버전 이름 (비우면 1.0.<실행 번호>)"
        required: false
        default: ""
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write # android-latest 릴리스에 APK 올리기

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 설정
        id: cfg
        env:
          INPUT_HOST: ${{ github.event.inputs.host }}
          VAR_HOST: ${{ vars.TWA_HOST }}
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          HOST="${INPUT_HOST:-$VAR_HOST}"
          HOST="${HOST#https://}"; HOST="${HOST#http://}"; HOST="${HOST%%/*}"
          if [ -z "$HOST" ]; then
            # 서버가 없으면 GitHub Pages 체험판을 연다
            HOST="${GITHUB_REPOSITORY_OWNER,,}.github.io"
            LAUNCH="/$REPO_NAME/courses/"
            PREFIX="/$REPO_NAME"
            MODE="체험판 (GitHub Pages, 데이터는 휴대폰에 저장)"
          else
            LAUNCH="/courses"
            PREFIX="/"
            MODE="서버 연결"
          fi
          VERSION="${INPUT_VERSION:-1.0.${GITHUB_RUN_NUMBER}}"
          # 입력값이 셸 명령에 들어가므로 형식을 엄격히 검사한다
          echo "$HOST" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$' || { echo "::error::도메인 형식이 올바르지 않습니다: $HOST"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9A-Za-z.+-]{1,32}$' || { echo "::error::버전 형식이 올바르지 않습니다: $VERSION"; exit 1; }
          echo "$LAUNCH$PREFIX" | grep -Eq '^[A-Za-z0-9/._-]+$' || { echo "::error::경로 형식이 올바르지 않습니다"; exit 1; }
          {
            echo "host=$HOST"; echo "launch=$LAUNCH"; echo "prefix=$PREFIX"; echo "version=$VERSION"; echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: 서명 키 준비
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "정식 서명 키 사용"
          else
            echo "저장소의 공개 테스트 키(app/test-signing.jks)로 서명합니다 — 시험용"
          fi

      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PtwaHost="${{ steps.cfg.outputs.host }}" \
            -PtwaLaunchPath="${{ steps.cfg.outputs.launch }}" \
            -PtwaPathPrefix="${{ steps.cfg.outputs.prefix }}" \
            -PappVersionName="${{ steps.cfg.outputs.version }}" \
            -PappVersionCode="${{ github.run_number }}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/hangulmanse.apk"
          printf '{"versionCode": %s, "versionName": "%s", "url": "https://%s%s", "builtAt": "%s"}\n' \
            "${{ github.run_number }}" "${{ steps.cfg.outputs.version }}" "${{ steps.cfg.outputs.host }}" "${{ steps.cfg.outputs.launch }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$GITHUB_WORKSPACE/out/version.json"

      - name: 서명 지문(SHA-256)과 요약
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/hangulmanse.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "## 한글만세 APK"
            echo "- 모드: ${{ steps.cfg.outputs.mode }}"
            echo "- 여는 주소: https://${{ steps.cfg.outputs.host }}${{ steps.cfg.outputs.launch }}"
            echo "- 버전: ${{ steps.cfg.outputs.version }} (${{ github.run_number }})"
            echo "- 서명 SHA-256: \`$FP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hangulmanse-apk-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: android-latest 릴리스에 올리기 (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "한글만세 Android 앱 (최신)" \
            --notes "main 브랜치가 바뀔 때마다 자동으로 다시 만들어지는 시험용 Android 앱입니다. 휴대폰에서 hangulmanse.apk 를 내려받아 설치하세요. (Chrome 필요)" \
            --latest
          gh release upload android-latest out/hangulmanse.apk --clobber
          gh release upload android-latest out/version.json --clobber
          git push origin "+HEAD:refs/tags/android-latest"
